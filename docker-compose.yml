version: '3.8'
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./backend/data/lpo.db}
      # Email Ingestion (uncomment and configure to enable)
      # - EMAIL_ENABLED=true
      # - EMAIL_IMAP_HOST=imap.gmail.com
      # - EMAIL_IMAP_PORT=993
      # - EMAIL_ADDRESS=your-email@gmail.com
      # - EMAIL_PASSWORD=your-gmail-app-password
      # - EMAIL_POLL_INTERVAL=5
    volumes:
      - lpo_data:/app/backend/data
    restart: unless-stopped

volumes:
  lpo_data:
